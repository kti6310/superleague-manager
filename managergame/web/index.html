<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super League Manager</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0F1B33; font-family: "Malgun Gothic", sans-serif; }
    #display { position: fixed; inset: 0; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #A9B4CC; font-size: 15px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="display"></div>
  <div id="status">Java 엔진을 불러오는 중입니다… (처음 한 번은 30초 정도 걸릴 수 있어요)</div>
  <script type="module">
    const status = document.getElementById("status");
    try {
      await cheerpjInit({ version: 17 });
      cheerpjCreateDisplay(-1, -1, document.getElementById("display"));
      status.remove();
      await cheerpjRunJar("/app/SuperLeague.jar");
    } catch (e) {
      status.textContent = "실행 실패: " + e + "  (인터넷 연결을 확인하거나 '게임 실행.vbs'를 사용하세요)";
    }
  </script>
</body>
</html>
